
name: Compilar WiFi Pix Router

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Firmware ESP32
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compilar firmware ESP32
        shell: bash
        run: |
          idf.py set-target esp32
          idf.py build

      - name: Salvar firmware compilado
        uses: actions/upload-artifact@v4
        with:
          name: wifi-pix-router-esp32
          path: |
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/flasher_args.json
          if-no-files-found: error
